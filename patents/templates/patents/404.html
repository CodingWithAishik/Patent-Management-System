{% extends 'patents/base.html' %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="page-header">
    <h1>404 - Page Not Found</h1>
</div>

<div class="error-container">
    <p class="main-message">
        Sorry, the page you're looking for doesn't exist.
    </p>
    
    <div class="detail-box">
        <p>
            The URL might be incorrect or the page may have been moved.
        </p>
    </div>
    
    <div class="action-buttons">
        <a href="{% url 'patents:home' %}" class="btn btn-primary">← Back to Home</a>
        <a href="{% url 'patents:copyright_list' %}" class="btn btn-secondary">View Copyrights</a>
    </div>
</div>
{% endblock %}
